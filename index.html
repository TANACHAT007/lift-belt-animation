<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lift Belt – อนิเมชันนำเสนอโครงงาน</title>
<style>

</style></head><body><div id="w">
<canvas id="c" width="1920" height="1080"></canvas>
<div class="bar"><button id="pp">⏸</button><span id="sb"></span><button id="nv">🔈 เสียงบรรยาย: ปิด</button><button id="fs">เต็มจอ</button>
<span class="hint">Space เล่น/หยุด · ← → เปลี่ยนฉาก · F เต็มจอ · N เสียง</span></div></div>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d'),W=1920,H=1080;
const FONT='"Noto Sans Thai","Sarabun",system-ui,sans-serif';
const img=new Image();img.src='assets/devices.png';
const THR=45,L=45,TR=55,AU=33,AF=33,BX=36,BH=34,XB=48,HY=26;
const S=4.3,OX=430,GY=900;
const R=d=>d*Math.PI/180,lerp=(a,b,k)=>a+(b-a)*k,cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),ease=x=>{x=cl(x);return x*x*(3-2*x)};
const X=x=>OX+x*S,Y=y=>GY-y*S;
// ---------- scenes: n=ชื่อปุ่ม d=วินาที say=คำบรรยาย (ซับไตเติล+เสียง)
const SC=[
 {n:'เปิด',d:7,say:'Lift Belt อุปกรณ์เตือนมุมก้มลำตัว เพื่อให้คนยกของรู้ตัวทันที'},
 {n:'ปัญหา',d:15,say:'คนงานก่อสร้างยกของทั้งวัน งานวิจัยพบว่าใช้เวลาราวหนึ่งในสี่อยู่ในท่าก้มเกิน 20 องศา และส่วนใหญ่ไม่รู้ตัว'},
 {n:'อุปกรณ์',d:13,say:'เราออกแบบอุปกรณ์สองชิ้น โหนดเอวคลิปติดเข็มขัดวัดมุมลำตัว และโหนดข้อมือสั่นเตือน'},
 {n:'ทำงานอย่างไร',d:15,say:'เซนเซอร์วัดการเอียงของลำตัวเทียบกับท่ายืนตรง เมื่อเกินเกณฑ์ มอเตอร์จะสั่นเตือนทันที พร้อมส่งข้อมูลผ่านบลูทูธ'},
 {n:'ยกผิดท่า',d:16,say:'ก้มหลังยกของ มุมเกินสี่สิบห้าองศา อุปกรณ์สั่นสามพัลส์'},
 {n:'ยกถูกท่า',d:14,say:'ย่อเข่า หลังตรง มุมไม่เกินเกณฑ์ อุปกรณ์เงียบ'},
 {n:'หน้าเว็บ',d:13,say:'ดูมุมแบบเรียลไทม์ ปรับเกณฑ์ และปรับศูนย์ได้จากหน้าเว็บบนมือถือ'},
 {n:'หลักฐาน',d:15,say:'งานทดลองของ NIOSH ปี 2023 ใช้เกณฑ์สี่สิบห้าองศา พบว่ามุมก้มสูงสุดลดลงในงานยกและตักดิน แต่เป็นผลในห้องทดลองเท่านั้น'},
 {n:'สรุป',d:12,say:'นี่คือต้นแบบเพื่อสร้างความตระหนักรู้ ไม่ใช่อุปกรณ์ทางการแพทย์ ขั้นต่อไปคือทดสอบกับผู้ใช้จริง'}
];
// ---------- helpers
function txt(s,x,y,sz,col,al,wt){g.font=(wt||'400')+' '+sz+'px '+FONT;g.fillStyle=col;g.textAlign=al||'left';g.textBaseline='alphabetic';g.fillText(s,x,y)}
function wrap(s,x,y,w,sz,col,lh,wt){g.font=(wt||'400')+' '+sz+'px '+FONT;let ln='',yy=y;for(const ch of s){const t=ln+ch;if(g.measureText(t).width>w&&ln){txt(ln,x,yy,sz,col,'left',wt);ln='';yy+=lh}ln+=ch}txt(ln,x,yy,sz,col,'left',wt);return yy+lh}
function rr(x,y,w,h,r,fill,stroke,lw){g.beginPath();g.roundRect(x,y,w,h,r);if(fill){g.fillStyle=fill;g.fill()}if(stroke){g.strokeStyle=stroke;g.lineWidth=lw||2;g.stroke()}}
function fade(t,d,a=.6,b=.6){return cl(Math.min(t/a,(d-t)/b))}
function ik(P,Tg,l1,l2,s){const dx=Tg[0]-P[0],dy=Tg[1]-P[1],full=Math.hypot(dx,dy)||1e-3,d=Math.min(full,l1+l2-.01);
 const a=(l1*l1-l2*l2+d*d)/(2*d),h=Math.sqrt(Math.max(0,l1*l1-a*a)),ux=dx/full,uy=dy/full;
 return{j:[P[0]+ux*a+s*h*-uy,P[1]+uy*a+s*h*ux],e:[P[0]+ux*d,P[1]+uy*d]}}
// ---------- background (cached)
const bg=document.createElement('canvas');bg.width=W;bg.height=H;
(function(){const b=bg.getContext('2d');let gr=b.createLinearGradient(0,0,0,GY);gr.addColorStop(0,'#0b1430');gr.addColorStop(.6,'#24305a');gr.addColorStop(1,'#d9825b');b.fillStyle=gr;b.fillRect(0,0,W,H);
 b.fillStyle='rgba(255,255,255,.7)';for(let i=0;i<60;i++){b.fillRect((i*389)%W,(i*173)%400,2,2)}
 b.fillStyle='#16203c';const bl=[[900,420,130],[1040,320,110],[1160,500,90],[1260,260,150],[1430,430,120],[1560,360,100],[1680,470,140],[1820,300,100]];
 bl.forEach(([x,h,w])=>{b.fillRect(x,GY-h,w,h);b.fillStyle='rgba(255,210,120,.5)';for(let yy=GY-h+16;yy<GY-20;yy+=34)for(let xx=x+12;xx<x+w-14;xx+=30)if(((xx*7+yy*3)|0)%5<2)b.fillRect(xx,yy,12,16);b.fillStyle='#16203c'});
 // tower crane
 b.strokeStyle='#0e1730';b.lineWidth=7;b.beginPath();b.moveTo(1500,GY);b.lineTo(1500,120);b.moveTo(1380,120);b.lineTo(1780,120);b.moveTo(1500,120);b.lineTo(1500,70);b.stroke();
 b.lineWidth=3;for(let y=GY;y>140;y-=40){b.beginPath();b.moveTo(1494,y);b.lineTo(1506,y-40);b.stroke()}b.lineWidth=2;b.beginPath();b.moveTo(1700,120);b.lineTo(1700,260);b.stroke();b.fillStyle='#0e1730';b.fillRect(1684,260,32,24);
 // scaffolding
 b.strokeStyle='rgba(10,15,30,.9)';b.lineWidth=4;for(let x=760;x<=1000;x+=80){b.beginPath();b.moveTo(x,GY);b.lineTo(x,GY-300);b.stroke()}for(let y=GY;y>=GY-300;y-=100){b.beginPath();b.moveTo(760,y);b.lineTo(1000,y);b.stroke()}
 // ground
 gr=b.createLinearGradient(0,GY,0,H);gr.addColorStop(0,'#3a3f4a');gr.addColorStop(1,'#1a1d24');b.fillStyle=gr;b.fillRect(0,GY,W,H-GY);
 b.fillStyle='#e0b43a';for(let x=0;x<W;x+=120)b.fillRect(x,GY+22,60,6);
})();
function plainBg(c){g.fillStyle=c||'#0c1220';g.fillRect(0,0,W,H);const gr=g.createRadialGradient(W/2,H*.4,100,W/2,H*.4,1100);gr.addColorStop(0,'rgba(74,163,255,.10)');gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(0,0,W,H)}
// ---------- worker
const GRAB={stoop:{th:85,hh:78},squat:{th:38,hh:45}};
function pose(mode,c,time){
 let th=0,hh=90,hx=0,hand=[6,93],carry=false;const sh=(t,h,x)=>[x+TR*Math.sin(R(t)),h+TR*Math.cos(R(t))];
 if(mode==='stand'){th=Math.sin(time*2)*.5}
 else{const G=GRAB[mode],gx=XB-6-TR*Math.sin(R(G.th)),gp=[XB,HY],st=sh(0,90,0),ch=[26,100];
  if(c<.3){const k=ease(c/.3);th=lerp(0,G.th,k);hh=lerp(90,G.hh,k);hx=lerp(0,gx,k);hand=[lerp(st[0]+6,gp[0],k),lerp(st[1]-52,gp[1],k)]}
  else if(c<.42){th=G.th;hh=G.hh;hx=gx;hand=gp}
  else if(c<.8){const k=ease((c-.42)/.38);th=lerp(G.th,0,k);hh=lerp(G.hh,90,k);hx=lerp(gx,0,k);hand=[lerp(gp[0],ch[0],k),lerp(gp[1],ch[1],k)];carry=true}
  else{th=0;hh=90;hx=0;hand=ch;carry=true}
  if(c>.05&&c<.8)th+=Math.sin(time*13)*.6}
 return{th,hh,hx,hand,carry,c}}
function limb(a,b,w,col,edge){g.lineCap='round';g.strokeStyle=edge||'#0a0f1a';g.lineWidth=(w+2.2)*S;g.beginPath();g.moveTo(X(a[0]),Y(a[1]));g.lineTo(X(b[0]),Y(b[1]));g.stroke();g.strokeStyle=col;g.lineWidth=w*S;g.beginPath();g.moveTo(X(a[0]),Y(a[1]));g.lineTo(X(b[0]),Y(b[1]));g.stroke()}
function worker(p,o){
 const hip=[p.hx,p.hh],tu=[Math.sin(R(p.th)),Math.cos(R(p.th))],sho=[hip[0]+TR*tu[0],hip[1]+TR*tu[1]];
 const leg=ik(hip,[0,0],L,L,1),arm=ik(sho,p.hand,AU,AF,-1),over=o.over;
 // ground shadow
 g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.ellipse(X(5),GY+6,70*S/3.2,9,0,0,7);g.fill();
 // box behind body
 if(o.boxA>0){const bc=p.carry&&p.c<.92?[arm.e[0]+BX/2-2,arm.e[1]-2]:[XB+BX/2,BH/2];g.globalAlpha=o.boxA;
  g.fillStyle='#c0914f';g.fillRect(X(bc[0]-BX/2),Y(bc[1]+BH/2),BX*S,BH*S);g.fillStyle='#a67a3d';g.fillRect(X(bc[0]-BX/2),Y(bc[1]+BH/2),BX*S,5*S);
  g.strokeStyle='#6e4d1f';g.lineWidth=3;g.strokeRect(X(bc[0]-BX/2),Y(bc[1]+BH/2),BX*S,BH*S);g.fillStyle='#e8d9b5';g.fillRect(X(bc[0]-6),Y(bc[1]+BH/2),12*S,BH*S);g.globalAlpha=1}
 // far arm, legs
 limb(sho,arm.j,8.5,'#7a4d0a');limb(arm.j,arm.e,7.5,'#b88a5e');
 limb(hip,leg.j,13,'#2f4660');limb(leg.j,[0,4],11,'#2f4660');
 g.fillStyle='#14181f';g.beginPath();g.roundRect(X(-8),Y(5),26*S,5*S,8);g.fill();
 // torso vest
 const vc=over?'#ff5a4d':'#ff9f1c';limb(hip,sho,17,vc);
 const nx=tu[1],ny=-tu[0];[.3,.62].forEach(k=>{const c=[lerp(hip[0],sho[0],k),lerp(hip[1],sho[1],k)];limb([c[0]-nx*8,c[1]-ny*8],[c[0]+nx*8,c[1]+ny*8],2.4,'#f4f1c9','rgba(0,0,0,0)')});
 // head + hard hat
 const hd=[sho[0]+14*tu[0],sho[1]+14*tu[1]];g.fillStyle='#e9b98a';g.beginPath();g.arc(X(hd[0]),Y(hd[1]),9*S,0,7);g.fill();
 g.fillStyle='#1b1b1b';g.beginPath();g.arc(X(hd[0]+3.5*Math.cos(R(p.th))),Y(hd[1]-3.5*Math.sin(R(p.th))+1),1.1*S,0,7);g.fill();
 g.save();g.translate(X(hd[0]),Y(hd[1]));g.rotate(R(p.th));g.fillStyle='#ffd23f';g.beginPath();g.arc(0,-.5*S,10*S,Math.PI,0);g.fill();g.fillRect(-.5*S,-1.6*S,14*S,2.2*S);g.restore();
 // front arm
 limb(sho,arm.j,9.5,'#ff9f1c');limb(arm.j,arm.e,8,'#e9b98a');
 // nodes
 let bn=null,wn=null;
 if(o.dev){const f=[tu[1],-tu[0]];bn=[hip[0]+tu[0]*3+f[0]*10,hip[1]+tu[1]*3+f[1]*10];
  g.save();g.translate(X(bn[0]),Y(bn[1]));g.rotate(R(p.th));g.fillStyle='#1d6fd1';g.beginPath();g.roundRect(-4.5*S,-8.5*S,9*S,17*S,6);g.fill();g.strokeStyle='#8ec5ff';g.lineWidth=2;g.stroke();
  g.fillStyle=over?'#ff4d4f':'#3ecf8e';g.beginPath();g.arc(0,-5*S,1.6*S,0,7);g.fill();g.restore();
  wn=[lerp(arm.j[0],arm.e[0],.78),lerp(arm.j[1],arm.e[1],.78)];
  const sx=o.buzz?(Math.random()-.5)*7:0,sy=o.buzz?(Math.random()-.5)*7:0;
  g.save();g.translate(X(wn[0])+sx,Y(wn[1])+sy);const ang=Math.atan2(-(arm.e[1]-arm.j[1]),arm.e[0]-arm.j[0]);g.rotate(ang);g.fillStyle=o.buzz?'#ff4d4f':'#1d6fd1';g.beginPath();g.roundRect(-5*S,-4.8*S,10*S,9.6*S,6);g.fill();g.strokeStyle='#8ec5ff';g.lineWidth=2;g.stroke();g.restore();
  if(o.buzz){for(let i=0;i<3;i++){const ph=((o.time*1.6+i/3)%1);g.strokeStyle='rgba(255,77,79,'+(1-ph)+')';g.lineWidth=4;g.beginPath();g.arc(X(wn[0]),Y(wn[1]),(18+ph*70),0,7);g.stroke()}}
  g.strokeStyle=over?'rgba(255,77,79,.9)':'rgba(120,190,255,.8)';g.setLineDash([10,9]);g.lineWidth=2.5;g.beginPath();g.moveTo(X(bn[0]),Y(bn[1]));g.quadraticCurveTo((X(bn[0])+X(wn[0]))/2-40,(Y(bn[1])+Y(wn[1]))/2-60,X(wn[0]),Y(wn[1]));g.stroke();g.setLineDash([]);
  const k=(o.time*1.1)%1,qx=(X(bn[0])+X(wn[0]))/2-40,qy=(Y(bn[1])+Y(wn[1]))/2-60,u=1-k;
  g.fillStyle=over?'#ff8a8a':'#bfe0ff';g.beginPath();g.arc(u*u*X(bn[0])+2*u*k*qx+k*k*X(wn[0]),u*u*Y(bn[1])+2*u*k*qy+k*k*Y(wn[1]),6,0,7);g.fill()}
 return{hip,sho,bn,wn,tu}}
function dial(cx,cy,r,a,over){g.lineCap='butt';const A=d=>Math.PI+R(d/90*180);
 g.lineWidth=30;g.strokeStyle='#2fc487';g.beginPath();g.arc(cx,cy,r,A(0),A(THR));g.stroke();g.strokeStyle='#ff4d4f';g.beginPath();g.arc(cx,cy,r,A(THR),A(90));g.stroke();
 g.lineWidth=2;g.strokeStyle='#fff';[0,45,90].forEach(d=>{g.beginPath();g.moveTo(cx+Math.cos(A(d))*(r-24),cy+Math.sin(A(d))*(r-24));g.lineTo(cx+Math.cos(A(d))*(r+24),cy+Math.sin(A(d))*(r+24));g.stroke()});
 txt('0°',cx-r-8,cy+30,22,'#9fb2c8','center');txt('45°',cx+Math.cos(A(45))*(r+50),cy+Math.sin(A(45))*(r+50),22,'#ff8a8a','center','700');txt('90°',cx+r+8,cy+30,22,'#9fb2c8','center');
 const na=A(cl(a,0,90));g.strokeStyle='#fff';g.lineWidth=7;g.lineCap='round';g.beginPath();g.moveTo(cx,cy);g.lineTo(cx+Math.cos(na)*(r-18),cy+Math.sin(na)*(r-18));g.stroke();g.fillStyle='#fff';g.beginPath();g.arc(cx,cy,12,0,7);g.fill();
 txt(Math.round(a)+'°',cx,cy+115,110,over?'#ff5a4d':'#3ecf8e','center','700');txt('มุมก้มลำตัว',cx,cy+155,28,'#9fb2c8','center')}
function title(t,sub){txt(t,80,100,52,'#fff','left','700');if(sub)txt(sub,80,146,26,'#9fb2c8')}
// ---------- scene renderers (t = seconds in scene)
let warn=0,wasOver=false,evT=-9;
function liftScene(t,mode,tt,sub){
 g.drawImage(bg,0,0);title(tt,sub);
 const cyc=9,c=(t/cyc)%1;if(t<.05){warn=0;wasOver=false;evT=-9}
 const p=pose(mode,c,t),ang=Math.max(0,p.th),over=ang>THR;
 if(over&&!wasOver){warn++;evT=t}if(!over)wasOver=false;else wasOver=true;
 const e=t-evT,buzz=over&&e<1.5&&(e%.5)<.27;
 const boxA=c>.92?1-(c-.92)/.08:c<.05?c/.05:1;
 worker(p,{dev:true,over,buzz,boxA,time:t});
 // right panel
 g.fillStyle='rgba(8,12,22,.78)';rr(1060,190,780,640,28,'rgba(8,12,22,.78)','rgba(120,160,210,.25)',2);
 dial(1450,470,200,ang,over);
 txt('เตือนแล้ว '+warn+' ครั้ง',1120,760,40,warn?'#ffb020':'#9fb2c8','left','700');
 const st=over?(buzz?'โหนดสั่น! (3 พัลส์)':'เกิน '+THR+'°'):(mode==='squat'?'อยู่ในเกณฑ์ ไม่เตือน':'ยืน/ยังไม่เกินเกณฑ์');
 txt(st,1840-40,760,36,over?'#ff5a4d':'#3ecf8e','right','700');
 txt('เกณฑ์เริ่มต้น 45° (ปรับได้) · ภาพจำลอง',1450,805,22,'#7f93a8','center');
}
const DRAW=[
// 0 title
(t)=>{plainBg('#08101e');
 for(let i=0;i<40;i++){const a=(t*.2+i*.37)%1;g.fillStyle='rgba(120,190,255,'+(.35*(1-a))+')';g.beginPath();g.arc((i*251)%W,H-a*H,3+(i%4),0,7);g.fill()}
 const k=ease(t/1.2);g.globalAlpha=k;
 // logo glyph: angle wedge
 g.strokeStyle='#4aa3ff';g.lineWidth=14;g.lineCap='round';g.beginPath();g.moveTo(760,380);g.lineTo(760,230);g.moveTo(760,380);g.lineTo(900,330);g.stroke();
 g.strokeStyle='#ff9f1c';g.lineWidth=8;g.beginPath();g.arc(760,380,80,-Math.PI/2,-Math.PI/2+R(20+25*ease((t-.8)/1.5)));g.stroke();
 txt('Lift Belt',980,360,150,'#fff','left','700');
 txt('อุปกรณ์เตือนมุมก้มลำตัวขณะยกของ',W/2,520,48,'#bfe0ff','center');
 txt('เพื่อสร้างความตระหนักรู้ในผู้ยกของ · ต้นแบบ (ไม่ใช่อุปกรณ์ทางการแพทย์)',W/2,590,28,'#7f93a8','center');
 txt('โครงงาน · '+ 'Login Learning',W/2,900,26,'#5f7186','center');g.globalAlpha=1},
// 1 problem
(t)=>{g.drawImage(bg,0,0);title('ปัญหา: ก้มหลังยกของซ้ำ ๆ โดยไม่รู้ตัว');
 const c=(t/9)%1,p=pose('stoop',c,t);const boxA=c>.92?1-(c-.92)/.08:c<.05?c/.05:1;
 const w=worker(p,{dev:false,over:p.th>THR,boxA,time:t});
 // spine inset
 rr(1060,190,780,640,28,'rgba(8,12,22,.78)','rgba(120,160,210,.25)',2);
 const a=Math.max(0,p.th),sx=1290,sy=800;
 let vx=sx,vy=sy;for(let i=0;i<12;i++){const ang=R(a)*(i/11)*.9;const low=i<4;g.fillStyle=low?`hsl(${Math.max(0,125-a*1.35)},75%,55%)`:'#9fb2c8';g.beginPath();g.roundRect(vx-17,vy-8,34,16,6);g.fill();
  if(low&&a>45){g.strokeStyle='rgba(255,90,70,'+cl((a-45)/40)+')';g.lineWidth=3;g.beginPath();g.arc(vx,vy,26+((t*30)%16),0,7);g.stroke()}
  vx+=Math.sin(ang)*19;vy-=Math.cos(ang)*19}
 txt('ยิ่งก้มมาก ภาระที่หลังส่วนล่างยิ่งสูง (ภาพประกอบเชิงแนวคิด)',1450,815,24,'#e8eef5','center');
 // fact counter
